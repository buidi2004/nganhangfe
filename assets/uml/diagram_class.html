<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #FFFFFF;
    font-family: 'Consolas', 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    width: 2150px;
    height: 1450px;
  }
  .diagram-container {
    width: 2110px;
    height: 1410px;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="diagram-container">
<svg width="2110" height="1410" viewBox="0 0 2110 1410" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <marker id="navArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
    </marker>
    <!-- Generalization (hollow triangle) -->
    <marker id="hollowTriangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.8"/>
    </marker>
    <!-- Realization (hollow triangle for dashed line) -->
    <marker id="realizeTriangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
    </marker>
    <!-- Composition (filled diamond) -->
    <marker id="compDiamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="12" markerHeight="8" orient="auto-start-reverse">
      <polygon points="1,5 8,1 15,5 8,9" fill="#0F2C59" stroke="#0F2C59" stroke-width="1.2"/>
    </marker>
    <!-- Aggregation (hollow diamond) -->
    <marker id="aggDiamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="12" markerHeight="8" orient="auto-start-reverse">
      <polygon points="1,5 8,1 15,5 8,9" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="headerGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="2110" height="65" fill="url(#headerGrad2)"/>
  <text x="30" y="42" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold" letter-spacing="0.5">SƠ ĐỒ LỚP TỔNG THỂ HỆ THỐNG CORE BANKING (UML CLASS DIAGRAM - Chuẩn UML 2.5 / Hexagonal Architecture)</text>
  <text x="1720" y="42" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="14">SenBank Domain Entities &amp; Hexagonal Ports</text>

  <!-- Architecture Layer Groups -->
  <!-- LAYER 1: Presentation (Top) -->
  <rect x="25" y="80" width="2060" height="235" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="45" y="105" fill="#0F2C59" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">1. TẦNG TRÌNH DIỄN &amp; CỔNG GIAO TIẾP (PRESENTATION LAYER - REST CONTROLLERS &amp; WEBSOCKET ADAPTER)</text>

  <!-- LAYER 2: Application Services / In-Ports (Middle-Top) -->
  <rect x="25" y="330" width="2060" height="240" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="45" y="355" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">2. TẦNG NGHIỆP VỤ &amp; CỔNG VÀO (APPLICATION LAYER - IN-PORTS USE CASES &amp; SERVICE IMPLEMENTATIONS)</text>

  <!-- LAYER 3: Core Domain Model & Entities (Middle-Bottom) -->
  <rect x="25" y="585" width="2060" height="565" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="45" y="610" fill="#1E40AF" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">3. TẦNG MÔ HÌNH THỰC THỂ LÕI (CORE BANKING DOMAIN MODEL - AGGREGATE ROOTS &amp; ENTITIES 3NF)</text>

  <!-- LAYER 4: Infrastructure Persistence & Outbox (Bottom) -->

  <text x="45" y="1190" fill="#B45309" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">4. TẦNG HẠ TẦNG DỮ LIỆU &amp; CỔNG RA (INFRASTRUCTURE LAYER - REPOSITORIES, OUTBOX RELAY &amp; PERSISTENCE)</text>
